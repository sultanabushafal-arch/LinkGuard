<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LinkGuard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>LinkGuard</h1>

        <p class="subtitle">
            تحليل الروابط واكتشاف المؤشرات المشبوهة
        </p>

        <div class="scanner-box">

            <input
                type="text"
                id="urlInput"
                placeholder="أدخل الرابط هنا..."
            >

            <button onclick="analyzeURL()">
                تحليل الرابط
            </button>

        </div>

        <div id="result" class="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
